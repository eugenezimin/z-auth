# cargo-audit configuration (read from .cargo/audit.toml in the workspace).

[advisories]
ignore = [
    # rsa: Marvin timing side channel in private-key operations (decryption
    # and signing), no fixed release.  It is reached only through z-auth-sso
    # (feature `oidc`): jsonwebtoken's `rust_crypto` backend uses it solely to
    # verify RS/PS-signed ID tokens with an identity provider's public key; no
    # private RSA key exists, so the timing leak has nothing to reveal.
    # Revisit if z-auth ever signs or decrypts with RSA.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5: secret-dependent branches in operations meant to be
    # constant-time (subtraction, division, Montgomery multiplication), fixed
    # in 0.7.6.  It is reached only through z-auth-sso (feature `oidc`):
    # jsonwebtoken's `rust_crypto` backend -> p256 / p384 -> elliptic-curve
    # 0.13, used solely to verify ES256 / ES384 ID tokens with an identity
    # provider's public key.  Every operand there is public, so timing reveals
    # nothing.  jsonwebtoken 11.1.0, the newest release, still depends on the
    # 0.13 curves.  Revisit when it moves to elliptic-curve 0.14, or if z-auth
    # ever signs with EC keys through this stack.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.30: the bundled C SQLite has CVE-2026-119375, fixed in
    # 0.39.  It is reached only through sqlx-sqlite, an optional dependency of
    # sqlx-macros-core that is never enabled: z-auth-postgres turns on sqlx's
    # `postgres` feature only, so `cargo tree --all-features -i libsqlite3-sys`
    # prints nothing and the crate is never compiled.  sqlx 0.9.0 still caps
    # libsqlite3-sys below 0.38.  Revisit when sqlx allows 0.39, or if z-auth
    # ever enables SQLite.
    "RUSTSEC-2026-0459",
]
