# cargo-audit configuration (read from .cargo/audit.toml in the workspace).

[advisories]
ignore = [
    # rsa: Marvin timing side channel in private-key operations (decryption
    # and signing), no fixed release.  rsa is reached in two ways.
    # - z-auth-sso (feature `oidc`) through jsonwebtoken's `rust_crypto`
    #   backend, which uses it only to verify RS/PS-signed ID tokens with an
    #   identity provider's public key; no private RSA key exists, so the
    #   timing leak has nothing to reveal.
    # - sqlx-mysql, an optional dependency of sqlx-macros-core that is never
    #   enabled: z-auth-postgres turns on sqlx's `postgres` feature only.
    # Revisit if z-auth ever signs or decrypts with RSA.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5: secret-dependent branches in operations meant to be
    # constant-time (subtraction, division, Montgomery multiplication), fixed
    # in 0.7.6.  It is reached only through z-auth-sso (feature `oidc`):
    # jsonwebtoken's `rust_crypto` backend -> p256 / p384 -> elliptic-curve
    # 0.13, used solely to verify ES256 / ES384 ID tokens with an identity
    # provider's public key.  Every operand there is public, so timing reveals
    # nothing.  jsonwebtoken 11.1.0, the newest release, still depends on the
    # 0.13 curves.  Revisit when it moves to elliptic-curve 0.14, or if z-auth
    # ever signs with EC keys through this stack.
    "RUSTSEC-2026-0387",
]
